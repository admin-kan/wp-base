services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - wp_base_db_data:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  wp-init:
    image: ${WP_IMAGE}
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["if [ ! -f /var/www/html/wp-includes/version.php ]; then cp -a /usr/src/wordpress/. /var/www/html/; fi"]
    volumes:
      - wp_base_wordpress_data:/var/www/html
      - ./app/wp-content/uploads:/var/www/html/wp-content/uploads
    networks: [backend]

  wordpress:
    image: ${WP_IMAGE}
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: ${DB_HOST}:${DB_PORT}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', '${APP_ENV}');
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_AUTO_UPDATE_CORE', false);
    volumes:
      - wp_base_wordpress_data:/var/www/html
      - ./app/wp-content/uploads:/var/www/html/wp-content/uploads
    networks: [frontend, backend]
    depends_on:
      db:
        condition: service_healthy
      wp-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: wpbuild1base/wp-base-nginx:1.0.0
    restart: unless-stopped
    ports:
      - "${WP_PORT}:80"
    volumes:
      - wp_base_wordpress_data:/var/www/html:ro
      - ./app/wp-content/uploads:/var/www/html/wp-content/uploads:ro
    networks: [frontend]
    depends_on:
      wordpress:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  frontend:
  backend:

volumes:
  wp_base_db_data:
  wp_base_wordpress_data:
